name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun --filter @codetype/shared test
      - run: bun --filter @codetype/shared exec tsc --noEmit
        continue-on-error: true

  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun --filter @codetype/domain test
      - run: bun --filter @codetype/domain exec tsc --noEmit
        continue-on-error: true

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun --filter @codetype/app test
      - run: bun --filter @codetype/app exec tsc --noEmit
        continue-on-error: true

  adapters-aws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun --filter @codetype/adapters-aws test
      - run: bun --filter @codetype/adapters-aws exec tsc --noEmit
        continue-on-error: true

  hex-deps-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run check:deps

  lambdas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun --filter @codetype/lambdas test
      - run: bun --filter @codetype/lambdas exec tsc --noEmit
        continue-on-error: true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            web/.next/cache
          key: bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun --filter @codetype/web lint
        continue-on-error: true
      - run: bun --filter @codetype/web test
      - run: bun --filter @codetype/web build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun --filter @codetype/web build
      - run: bun --filter @codetype/infra cdk synth

  merge-gate:
    needs: [shared, domain, app, adapters-aws, hex-deps-gate, lambdas, web, infra]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All required jobs passed."
