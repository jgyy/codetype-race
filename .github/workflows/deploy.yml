name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Run shared tests
        working-directory: shared
        run: |
          bun install
          bun test
      - name: Sync shared into lambdas + web
        run: |
          rm -rf lambdas/src/shared web/src/shared
          mkdir -p lambdas/src/shared web/src/shared
          cp shared/src/*.ts lambdas/src/shared/
          cp shared/src/*.ts web/src/shared/
      - name: Lambda install
        working-directory: lambdas
        run: bun install
      - name: Infra deploy
        working-directory: infra
        run: |
          bun install
          bunx cdk deploy --require-approval never
      - name: Web build
        working-directory: web
        run: |
          bun install
          bun run build
      - name: Sync web bundle to S3
        env:
          STACK: CodetypeStack
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='SiteBucket'].OutputValue" --output text)
          aws s3 sync web/out "s3://$BUCKET" --delete
